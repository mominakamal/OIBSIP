<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <h1>My Tasks</h1>

    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add a new task...">
      <button id="addBtn">Add Task</button>
    </div>

    <div class="list-section">
      <div class="list-header">
        <h2>Pending</h2>
        <span id="pendingCount" class="count-badge">0 pending</span>
      </div>
      <ul id="pendingList" class="task-list"></ul>
      <p id="pendingEmpty" class="empty-msg">No pending tasks — add one above!</p>
    </div>

    <div class="list-section">
      <div class="list-header">
        <h2>Completed</h2>
        <span id="completedCount" class="count-badge">0 completed</span>
      </div>
      <ul id="completedList" class="task-list"></ul>
      <p id="completedEmpty" class="empty-msg">No completed tasks yet.</p>
    </div>
  </div>

  <script src="todo-script.js"></script>
</body>
</html>
